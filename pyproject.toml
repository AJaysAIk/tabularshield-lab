[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tabularshield-lab"
version = "0.1.0"
description = "Reproducible research on disclosure risk and utility in magnitude tables"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Ajay Sai Kummara"}]
dependencies = ["numpy>=2.2", "pandas>=2.2", "scipy>=1.15", "matplotlib>=3.10", "fastapi>=0.115", "uvicorn>=0.34"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "hypothesis>=6", "httpx>=0.28", "ruff>=0.11", "build>=1.2"]

[project.scripts]
tabularshield = "tabularshield.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
